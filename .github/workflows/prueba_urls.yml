name: Prueba de direcciones
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.ub.edu/catedres/) https://www.ub.edu/catedres/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.ub.edu/catedres/es/empresas-y-entidades) https://www.ub.edu/catedres/es/empresas-y-entidades"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://web.ub.edu/ca/web/catedres-aules) https://web.ub.edu/ca/web/catedres-aules"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.uib.es/es/coneix-nos/organitzacio/estructura/catedres) https://www.uib.es/es/coneix-nos/organitzacio/estructura/catedres"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.uib.eu/coneix-nos/organitzacio/estructura/catedres) https://www.uib.eu/coneix-nos/organitzacio/estructura/catedres"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://estudis.uib.cat/) https://estudis.uib.cat/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.uib.cat/) https://www.uib.cat/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.ull.es/) https://www.ull.es/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://www.ull.es/la-universidad/catedras-institucionales-y-de-empresa/) https://www.ull.es/la-universidad/catedras-institucionales-y-de-empresa/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://web.ull.es/) https://web.ull.es/"
          echo "$(curl -sL -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}" https://portal.ull.es/) https://portal.ull.es/"
